[project]
name = "hamtools"
version = "0.1.0"
description = "Reverse-engineering and modding tools for Hamtaro: Ham-Ham Heartbreak (GBA)"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
hamtools = "hamtools.cli:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "tools"
module-name = "hamtools"
